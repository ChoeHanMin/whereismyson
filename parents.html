<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f5e">
  <title>아들 어디야</title>
  <link rel="manifest" href="parents.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>아들 어디야 <small>出必告 反必面</small></h1>
    <button id="logoutBtn" class="text-btn" hidden>로그아웃</button>
  </header>

  <main>
    <!-- 로그인 -->
    <section class="panel" id="loginPanel" hidden>
      <h2>🔐 로그인</h2>
      <p class="note">등록된 전화번호와 PIN으로 로그인해 주세요.</p>
      <label>전화번호
        <input id="loginPhone" type="tel" inputmode="numeric" placeholder="010-0000-0000">
      </label>
      <label>PIN (6자리)
        <input id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">
      </label>
      <p class="error" id="loginError" hidden></p>
      <button class="primary" id="loginBtn">로그인</button>
    </section>

    <section class="panel" id="notReady" hidden>
      <p class="note">아직 서버가 준비되지 않았어요.</p>
    </section>

    <!-- 로그인 후 -->
    <section class="status-card" id="statusCard" hidden>
      <div class="status-emoji" id="statusEmoji">⏳</div>
      <div>
        <div class="status-label" id="statusLabel">불러오는 중…</div>
        <div class="status-detail" id="statusDetail"></div>
      </div>
    </section>

    <section class="panel" id="kakaoPanel" hidden>
      <h2>🟡 카톡으로 소식 받기</h2>
      <div id="kakaoConnect">
        <p class="note">아들이 버튼 한 번으로 카톡을 보낼 수 있게 한 번만 연결해 주세요.</p>
        <button class="kakao" id="kakaoLoginBtn">카카오톡 연결</button>
      </div>
      <p class="note" id="kakaoConnected" hidden>✅ 연결됐어요. 이제 아들 소식이 카톡으로 와요.</p>
    </section>

    <section class="panel" id="eventsPanel" hidden>
      <h2>📜 최근 소식</h2>
      <ul id="events" class="history"></ul>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="parents.js?v=11"></script>
</body>
</html>
