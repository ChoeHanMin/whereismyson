<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f5e">
  <title>Where is my son</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>반필고 출필면</h1>
    <button id="openSettings" class="icon-btn" aria-label="설정">⚙️</button>
  </header>

  <main>
    <section class="status-card" id="statusCard">
      <div class="status-emoji" id="statusEmoji">🏠</div>
      <div>
        <div class="status-label" id="statusLabel">집에 있어요</div>
        <div class="status-detail" id="statusDetail"></div>
      </div>
    </section>

    <div class="banner" id="overdueBanner" hidden>
      ⏰ 귀가 예정 시간이 지났어요. 늦는다고 알려드릴까요?
    </div>

    <!-- 집에 있을 때: 나가요 -->
    <section class="panel" id="leavePanel">
      <h2>🚪 나가요</h2>
      <label>누구 만나요?
        <input id="who" type="text" placeholder="예: 철수, 동아리 친구들" autocomplete="off">
      </label>
      <label>어디 가요?
        <input id="where" type="text" placeholder="예: 강남역" autocomplete="off">
      </label>
      <label>몇 시쯤 들어와요?
        <input id="eta" type="time">
      </label>
      <button class="primary" id="leaveBtn">나간다고 알리기</button>
    </section>

    <!-- 밖에 있을 때: 늦어요 / 들어왔어요 -->
    <section class="panel" id="outPanel" hidden>
      <h2>🙏 늦어요</h2>
      <div class="chips">
        <button class="chip" data-late="30">+30분</button>
        <button class="chip" data-late="60">+1시간</button>
        <button class="chip" data-late="120">+2시간</button>
      </div>
      <label>직접 정하기
        <input id="newEta" type="time">
      </label>
      <label>사유 (선택)
        <input id="lateReason" type="text" placeholder="예: 막차 놓쳤어요" autocomplete="off">
      </label>
      <button class="secondary" id="lateBtn">늦는다고 알리기</button>

      <hr>
      <button class="primary" id="homeBtn">🏠 들어왔다고 알리기</button>
    </section>

    <section class="panel">
      <h2>📜 기록</h2>
      <ul id="history" class="history"></ul>
      <button class="text-btn" id="clearHistory">기록 지우기</button>
    </section>
  </main>

  <!-- 보내기 시트 -->
  <dialog id="sendDialog">
    <h2>어머니께 보내기</h2>
    <pre id="preview" class="preview"></pre>
    <div class="send-actions">
      <button class="primary" id="sendSms">💬 문자로 보내기</button>
      <button class="kakao" id="sendShare">🟡 카톡으로 보내기</button>
      <button class="text-btn" id="copyMsg">복사만 하기</button>
      <button class="text-btn" id="cancelSend">취소</button>
    </div>
  </dialog>

  <!-- 설정 -->
  <dialog id="settingsDialog">
    <h2>설정</h2>
    <label>어머니 휴대폰 번호
      <input id="momPhone" type="tel" placeholder="010-1234-5678">
    </label>
    <label>어머니 호칭
      <input id="momName" type="text" placeholder="엄마">
    </label>
    <label>내 이름
      <input id="myName" type="text" placeholder="예: 한민">
    </label>
    <div class="send-actions">
      <button class="primary" id="saveSettings">저장</button>
      <button class="text-btn" id="closeSettings">닫기</button>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
